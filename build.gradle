plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
}

configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    // Optional at run time: FreeTerraForged's tiles are read for the ground height (copy its jar into libs/ to build).
    compileOnly files(project.findProperty('ftfJar') ?: 'libs/freeterraforged-1.0.0010.jar')
    // FreeTerraForged 1.0.0013 (deleteTiles) after it, for the classes 1.0.0010 does not have (cell.filter.FilterGrid for
    // the erosion filter on its chunk grids); the ones both have resolve to 1.0.0010's above.
    compileOnly files(project.findProperty('ftf13Jar') ?: 'libs/freeterraforged-1.0.0013.jar')
    // Optional at run time: C2ME's chunk system (the 4x4 area step's status and dependency hooks). Copied from the C2ME
    // jar's META-INF/jars into libs/c2me/ (base-all for flowsched, rewrites-chunk-system, rxjava) to build.
    compileOnly fileTree(dir: 'libs/c2me', include: '*.jar')
    // The CUDA driver API and NVRTC from Java: LWJGL's CUDA module, matching Minecraft 1.21.1's LWJGL 3.3.3 (its core
    // comes with the game). Its classes are copied into the mod's own jar without its module descriptor (see jar
    // below): as a nested module it required org.lwjgl, which a dedicated server does not have, and the server would
    // not start; now a server without LWJGL starts and the mod leaves the GPU off (gpu/Lwjgl).
    shade('org.lwjgl:lwjgl-cuda:3.3.3') {
        transitive = false
    }
}

jar {
    from({ configurations.shade.collect { zipTree(it) } }) {
        exclude 'META-INF/**'
    }
}

// The version the game shows (neoforge.mods.toml) is mod_version from gradle.properties, as the jar's name is: written by
// hand there it stayed at 0.5.6 while the jar went on to 0.11.5.
processResources {
    def properties = [mod_version: mod_version]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }
}

// The game instance's logs folder, where the mod saves the sources and chunks the offline checks read: -Plogs=<folder>,
// or logs=<folder> in the user's own ~/.gradle/gradle.properties.
def gameLogs = project.findProperty('logs') ?: 'run/logs'
tasks.withType(JavaExec).configureEach {
    systemProperty 'wgaccel.logs', gameLogs
    // Offline checks for another GPU architecture: -PgpuArch=61 (GTX 10xx), 75 (RTX 20xx), ... (a newer card runs older PTX).
    if (project.findProperty('gpuArch')) {
        systemProperty 'wgaccel.gpuArch', project.findProperty('gpuArch')
    }
    // The checks that go through gpu/Gpu on an AMD card: -PgpuBackend=hip (e.g. `gradlew.bat cudaErosionCheck -PgpuBackend=hip`).
    if (project.findProperty('gpuBackend')) {
        systemProperty 'wgaccel.gpuBackend', project.findProperty('gpuBackend')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// A standalone check of the GPU route, outside the game: `gradlew.bat cudaCheck` lists the GPU, compiles a kernel with
// NVRTC at run time and compares its float results with Java's, bit for bit. LWJGL 3.3.3 is Minecraft 1.21.1's.
repositories {
    mavenCentral()
}

sourceSets {
    cudacheck {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

dependencies {
    cudacheckImplementation 'org.lwjgl:lwjgl:3.3.3'
    cudacheckImplementation 'org.lwjgl:lwjgl-cuda:3.3.3'
    cudacheckRuntimeOnly 'org.lwjgl:lwjgl:3.3.3:natives-windows'
    // FreeTerraForged's NoiseUtil (its noise tables) loads on its own, without Minecraft.
    cudacheckImplementation files('libs/freeterraforged-1.0.0010.jar')
}

tasks.register('cudaCheck', JavaExec) {
    group = 'verification'
    description = 'Runs the standalone CUDA check (GPU, NVRTC, bit-identical floats).'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.CudaCheck'
    def cuda = System.getenv('CUDA_PATH') ?: 'C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.9'
    environment 'PATH', "${cuda}/bin;" + System.getenv('PATH')
    systemProperty 'wgaccel.nvrtc', "${cuda}/bin/nvrtc64_120_0.dll"
}

// The same on an AMD card: `gradlew.bat hipCheck` uses the driver's HIP runtime and the AMD HIP SDK's hipRTC (found as
// the mod finds it: -Dwgaccel.hiprtc, HIP_PATH, C:/Program Files/AMD/ROCm/*, PATH), then compiles the fixed kernel sources.
tasks.register('hipCheck', JavaExec) {
    group = 'verification'
    description = 'Runs the standalone HIP check on an AMD card (GPU, hipRTC, bit-identical floats).'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.HipCheck'
    if (project.findProperty('hipArch')) {
        systemProperty 'wgaccel.hipArch', project.findProperty('hipArch')
    }
}

// Generated noise trees outside the game: `gradlew.bat cudaTreeCheck` builds stand-in trees of every FreeTerraForged
// noise kind, generates their CUDA, compiles it with NVRTC and runs it (catches codegen mistakes before a world load).
tasks.register('cudaTreeCheck', JavaExec) {
    group = 'verification'
    description = 'Generates, compiles and runs CUDA for stand-in noise trees of every kind.'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.TreeCodegenCheck'
    def cuda = System.getenv('CUDA_PATH') ?: 'C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.9'
    environment 'PATH', "${cuda}/bin;" + System.getenv('PATH')
    systemProperty 'wgaccel.nvrtc', "${cuda}/bin/nvrtc64_120_0.dll"
}

// FreeTerraForged's tile erosion filter outside the game: `gradlew.bat cudaErosionCheck` runs a plain-Java copy of it and
// the GPU kernels on a made-up tile and compares them bit for bit.
tasks.register('cudaErosionCheck', JavaExec) {
    group = 'verification'
    description = 'Compares the GPU erosion filter with a Java copy of the FreeTerraForged one on a made-up tile.'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.ErosionFilterCheck'
    def cuda = System.getenv('CUDA_PATH') ?: 'C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.9'
    environment 'PATH', "${cuda}/bin;" + System.getenv('PATH')
    systemProperty 'wgaccel.nvrtc', "${cuda}/bin/nvrtc64_120_0.dll"
}

// The End's islands outside the game (C2.5): `gradlew.bat cudaEndIslandsCheck` runs Minecraft's own End islands function
// against its generated CUDA and compares them bit for bit.
tasks.register('cudaEndIslandsCheck', JavaExec) {
    group = 'verification'
    description = 'Compares the GPU version of the End islands density function with the Minecraft class.'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.EndIslandsCheck'
    def cuda = System.getenv('CUDA_PATH') ?: 'C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.9'
    environment 'PATH', "${cuda}/bin;" + System.getenv('PATH')
    systemProperty 'wgaccel.nvrtc', "${cuda}/bin/nvrtc64_120_0.dll"
}

// Vanilla's NormalNoise outside the game: `gradlew.bat cudaVanillaNoiseCheck` runs Minecraft's own noise classes against
// the GPU kernels and compares them bit for bit.
tasks.register('cudaVanillaNoiseCheck', JavaExec) {
    group = 'verification'
    description = 'Compares the GPU version of vanilla NormalNoise with the Minecraft classes.'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.VanillaNoiseCheck'
    def cuda = System.getenv('CUDA_PATH') ?: 'C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.9'
    environment 'PATH', "${cuda}/bin;" + System.getenv('PATH')
    systemProperty 'wgaccel.nvrtc', "${cuda}/bin/nvrtc64_120_0.dll"
}

// Generated density functions outside the game: `gradlew.bat cudaDensityCheck` builds stand-in trees of every vanilla
// density function kind the overworld uses (real NormalNoises), generates their CUDA, compiles it and runs it.
// C2 (vanilla): `gradlew.bat cudaVanillaDensityCheck` compares the GPU's ShiftA, ShiftB, Shift, ShiftedNoise and
// BlendedNoise with Minecraft's own Java, bit for bit.
// C2: `gradlew.bat cudaCornerColumnsCheck`: corners with column subtrees cached per corner column vs worked out per
// corner, bit for bit, on a vanilla-like tree.
tasks.register('cudaCornerColumnsCheck', JavaExec) {
    group = 'verification'
    description = 'Checks the corner kernel with cached column subtrees against the plain one, bit for bit.'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.CornerColumnsCheck'
    def cuda = System.getenv('CUDA_PATH') ?: 'C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.9'
    environment 'PATH', "${cuda}/bin;" + System.getenv('PATH')
    systemProperty 'wgaccel.nvrtc', "${cuda}/bin/nvrtc64_120_0.dll"
}

tasks.register('cudaVanillaDensityCheck', JavaExec) {
    group = 'verification'
    description = 'Checks the vanilla-only density function kinds on the GPU against Minecraft, bit for bit.'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.VanillaDensityCheck'
    def cuda = System.getenv('CUDA_PATH') ?: 'C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.9'
    environment 'PATH', "${cuda}/bin;" + System.getenv('PATH')
    systemProperty 'wgaccel.nvrtc', "${cuda}/bin/nvrtc64_120_0.dll"
}

tasks.register('cudaDensityCheck', JavaExec) {
    group = 'verification'
    description = 'Generates, compiles and runs CUDA for stand-in density function trees of every kind.'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.DensityCodegenCheck'
    def cuda = System.getenv('CUDA_PATH') ?: 'C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.9'
    environment 'PATH', "${cuda}/bin;" + System.getenv('PATH')
    systemProperty 'wgaccel.nvrtc', "${cuda}/bin/nvrtc64_120_0.dll"
}

// The real noise fill outside the game: `gradlew.bat cudaFillBench` compiles the instance's logs/wgaccel-noise-fill.cu,
// checks the chunks the game saved beside it (wgaccel-noise-fill-sample-N.bin) byte for byte and times the kernels.
tasks.register('cudaFillBench', JavaExec) {
    group = 'verification'
    description = 'Runs the game-made noise fill code on the GPU against the chunks the game saved, and times it.'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.FillBench'
    def cuda = System.getenv('CUDA_PATH') ?: 'C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.9'
    environment 'PATH', "${cuda}/bin;" + System.getenv('PATH')
    systemProperty 'wgaccel.nvrtc', "${cuda}/bin/nvrtc64_120_0.dll"
    if (project.hasProperty('fillSource')) {
        systemProperty 'wgaccel.fillSource', project.property('fillSource')
    }
    if (project.hasProperty('cache')) {
        systemProperty 'wgaccel.cache', project.property('cache')
    }
}

// A game-made CUDA source compiled outside the game: `gradlew.bat cudaCompileCheck -Pcu=<path to a .cu>`.
tasks.register('cudaCompileCheck', JavaExec) {
    group = 'verification'
    description = 'Compiles a saved CUDA source with NVRTC and the mod options.'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.CompileCheck'
    def cuda = System.getenv('CUDA_PATH') ?: 'C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.9'
    environment 'PATH', "${cuda}/bin;" + System.getenv('PATH')
    systemProperty 'wgaccel.nvrtc', "${cuda}/bin/nvrtc64_120_0.dll"
    args project.findProperty('cu') ?: 'missing.cu'
}

// I3: the surface prepass's warp column walk against the old one-thread walk on made-up columns.
tasks.register('cudaPrepassCheck', JavaExec) {
    group = 'verification'
    description = 'Compares the warp surface prepass with the one-thread one on made-up columns.'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.PrepassCheck'
    def cuda = System.getenv('CUDA_PATH') ?: 'C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.9'
    environment 'PATH', "${cuda}/bin;" + System.getenv('PATH')
    systemProperty 'wgaccel.nvrtc', "${cuda}/bin/nvrtc64_120_0.dll"
}

// I3: the strata noise per chunk with different block shapes, on the game's saved strata source.
tasks.register('cudaStrataShapeBench', JavaExec) {
    group = 'verification'
    description = 'Times the strata columns kernel with different block shapes.'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.StrataShapeBench'
    def cuda = System.getenv('CUDA_PATH') ?: 'C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.9'
    environment 'PATH', "${cuda}/bin;" + System.getenv('PATH')
    systemProperty 'wgaccel.nvrtc', "${cuda}/bin/nvrtc64_120_0.dll"
}

// I3: a high-priority launch's wait next to busy low-priority streams, with -Pconnections=8 (default) or 32.
tasks.register('cudaQueueBench', JavaExec) {
    group = 'verification'
    description = 'Times a high-priority launch next to busy streams for a CUDA_DEVICE_MAX_CONNECTIONS value.'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.QueueBench'
    def cuda = System.getenv('CUDA_PATH') ?: 'C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.9'
    environment 'PATH', "${cuda}/bin;" + System.getenv('PATH')
    systemProperty 'wgaccel.nvrtc', "${cuda}/bin/nvrtc64_120_0.dll"
    systemProperty 'connections', project.findProperty('connections') ?: '8'
    systemProperty 'preload', project.findProperty('preload') ?: 'false'
}

// Where the mod finds NVRTC when the game has no CUDA_PATH (started before the toolkit was installed).
tasks.register('cudaNvrtcLookupCheck', JavaExec) {
    group = 'verification'
    description = 'Finds and loads NVRTC as the mod does, with CUDA_PATH and CUDA_PATH_V* removed.'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.NvrtcLookupCheck'
    environment.keySet().removeIf { it.toUpperCase().startsWith('CUDA_PATH') }
}

tasks.register('cudaSurfaceInputsCheck', JavaExec) {
    group = 'verification'
    description = 'Compiles the surface input kernel with stand-in constants.'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.SurfaceInputsCheck'
    def cuda = System.getenv('CUDA_PATH') ?: 'C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.9'
    environment 'PATH', "${cuda}/bin;" + System.getenv('PATH')
    systemProperty 'wgaccel.nvrtc', "${cuda}/bin/nvrtc64_120_0.dll"
}

tasks.register('cudaBiomeBench', JavaExec) {
    group = 'verification'
    description = 'Checks and times the biome kernels on chunks saved from the game (-Plogs=<instance logs folder>).'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.BiomeBench'
    def cuda = System.getenv('CUDA_PATH') ?: 'C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.9'
    environment 'PATH', "${cuda}/bin;" + System.getenv('PATH')
    systemProperty 'wgaccel.nvrtc', "${cuda}/bin/nvrtc64_120_0.dll"
    args = [gameLogs]
}

tasks.register('cudaBeardifierCheck', JavaExec) {
    group = 'verification'
    description = 'The GPU Beardifier against the Minecraft methods, bit for bit.'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.BeardifierCheck'
    def cuda = System.getenv('CUDA_PATH') ?: 'C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.9'
    environment 'PATH', "${cuda}/bin;" + System.getenv('PATH')
    systemProperty 'wgaccel.nvrtc', "${cuda}/bin/nvrtc64_120_0.dll"
}
