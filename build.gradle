// ASM for the loader jars' relocation of the copied LWJGL modules (relocateLwjgl below).
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.ow2.asm:asm-commons:9.8'
    }
}

// Built with Architectury's Gradle plugins (build time only: neither jar needs Architectury in the game). Each Minecraft
// version (versions/<mc>, see settings.gradle) has a common project, compiled once with Mojang's names, and a neoforge
// and a fabric project that each make their loader's jar from it. Their build logic is shared (gradle/common.gradle,
// gradle/neoforge.gradle, gradle/fabric.gradle); what differs per version is in versions/<mc>/gradle.properties.
// Minecraft 26.1 and later is not obfuscated: no mappings, nothing remapped (Loom's no-remap plugin, the same jar).
plugins {
    id 'architectury-plugin' version '3.5.170' apply false
    id 'dev.architectury.loom' version '1.17.493' apply false
    id 'com.gradleup.shadow' version '9.2.2' apply false
}

// The LWJGL CUDA and OpenCL modules (Java only: the libraries are the driver's), copied into each loader jar without
// their module descriptors: as a nested module LWJGL CUDA required org.lwjgl, which a dedicated server does not have,
// and the server would not start; now a server without LWJGL starts and the mod leaves the GPU off (gpu/Lwjgl). Their
// classes are moved to com.wgaccel.shaded.lwjgl, and the mod's own classes made to use them there: another mod with its
// own copy of org.lwjgl.opencl (RoadWeaver 2.3.2) made two modules export the same package and the game did not start.
// LWJGL's core (org.lwjgl.system), which they call, stays the game's.
// Per version (versions/<mc>/gradle.properties lwjgl_shaded), at the game's own LWJGL version, which they call into:
// CUDA and OpenCL 3.3.3 for 1.21.1; OpenCL 3.4.1 only for 26.1.2 (LWJGL 3.4 has no CUDA module, and 3.3's needs JNI
// methods 3.4's core no longer has: there the mod calls the CUDA driver itself, gpu/cuda in versions/26.1.2).
ext.lwjglShaded = { String modules -> modules.split(',')*.trim() }
def relocations = ['org/lwjgl/opencl/': 'com/wgaccel/shaded/lwjgl/opencl/', 'org/lwjgl/cuda/': 'com/wgaccel/shaded/lwjgl/cuda/']

/**
 * Adds the shaded jars' classes to a finished loader jar and moves them (and the mod's uses of them) to
 * com.wgaccel.shaded.lwjgl; added: further files for the jar, by their path in it.
 */
ext.relocateLwjgl = { File file, Collection<File> shaded, Map<String, byte[]> added = [:] ->
    def moved = new File(file.parentFile, file.name + '.relocating')
    def remapper = new org.objectweb.asm.commons.Remapper() {
        @Override
        String map(String name) {
            for (def entry : relocations.entrySet()) {
                if (name.startsWith(entry.key)) {
                    return entry.value + name.substring(entry.key.length())
                }
            }
            return name
        }
    }
    def output = new java.util.zip.ZipOutputStream(new FileOutputStream(moved))
    def written = new HashSet<String>()
    def copy = { java.util.zip.ZipFile input, boolean dependency ->
        for (def entry : input.entries().toList()) {
            // The LWJGL jars' META-INF (manifest, module descriptor) is left out, and so are the emptied folders (org/, org/lwjgl/).
            if (dependency && (entry.directory || entry.name.startsWith('META-INF/'))) {
                continue
            }
            if (entry.directory && relocations.keySet().any { it.startsWith(entry.name) }) {
                continue
            }

            def bytes = input.getInputStream(entry).bytes
            def name = entry.name
            if (name.endsWith('.class')) {
                def writer = new org.objectweb.asm.ClassWriter(0)
                new org.objectweb.asm.ClassReader(bytes).accept(new org.objectweb.asm.commons.ClassRemapper(writer, remapper), 0)
                bytes = writer.toByteArray()
                name = remapper.map(name.substring(0, name.length() - 6)) + '.class'
            } else {
                for (def relocation : relocations.entrySet()) {
                    if (name.startsWith(relocation.key)) {
                        name = relocation.value + name.substring(relocation.key.length())
                    }
                }
            }
            if (!written.add(name)) {
                continue
            }

            def out = new java.util.zip.ZipEntry(name)
            out.time = entry.time
            output.putNextEntry(out)
            output.write(bytes)
            output.closeEntry()
        }
    }
    try {
        def input = new java.util.zip.ZipFile(file)
        try {
            copy(input, false)
        } finally {
            input.close()
        }
        for (File jar : shaded) {
            def dependency = new java.util.zip.ZipFile(jar)
            try {
                copy(dependency, true)
            } finally {
                dependency.close()
            }
        }
        added.each { name, bytes ->
            output.putNextEntry(new java.util.zip.ZipEntry(name))
            output.write(bytes)
            output.closeEntry()
        }
    } finally {
        output.close()
    }
    file.delete()
    moved.renameTo(file)
}

/**
 * The runtime-to-Mojang name table for Fabric's jar (platform/Names reads it), from Loom's mappings (intermediary and
 * Mojang's names): "c <intermediary class> <Mojang class>" for every renamed class, "m <intermediary member> <Mojang
 * name>" for every renamed field and method (an intermediary member name names one member), and "o <owner> <member>
 * <Mojang name>" for the few intermediary names that two Mojang names share (Items.DEEPSLATE and SleepStatus.activePlayers).
 */
ext.namesTable = { java.nio.file.Path tiny ->
    def classes = new StringBuilder()
    def members = new LinkedHashMap<String, LinkedHashMap<String, String>>()
    tiny.withReader('UTF-8') { reader ->
        def header = reader.readLine().split('\t')
        int intermediary = header.findIndexOf { it == 'intermediary' } - 3
        int named = header.findIndexOf { it == 'named' } - 3
        String owner = null
        String line
        while ((line = reader.readLine()) != null) {
            def parts = line.split('\t', -1)
            if (parts[0] == 'c') {
                owner = parts[1 + intermediary]
                if (owner != parts[1 + named]) {
                    classes.append(['c', owner, parts[1 + named]].join('\t')).append('\n')
                }
            } else if (parts.length > 3 + named && parts[0] == '' && (parts[1] == 'f' || parts[1] == 'm')) {
                def runtime = parts[3 + intermediary]
                def mojang = parts[3 + named]
                if (runtime != mojang && (runtime.startsWith('field_') || runtime.startsWith('method_') || runtime.startsWith('comp_'))) {
                    members.computeIfAbsent(runtime) { new LinkedHashMap<String, String>() }.put(owner, mojang)
                }
            }
        }
    }
    def text = new StringBuilder(classes)
    members.each { runtime, byOwner ->
        def names = byOwner.values() as Set
        text.append(['m', runtime, byOwner.values().first()].join('\t')).append('\n')
        if (names.size() > 1) {
            byOwner.each { owner, mojang -> text.append(['o', owner, runtime, mojang].join('\t')).append('\n') }
        }
    }
    def bytes = new ByteArrayOutputStream()
    def gzip = new java.util.zip.GZIPOutputStream(bytes)
    gzip.write(text.toString().getBytes('UTF-8'))
    gzip.close()
    return bytes.toByteArray()
}

// After the helpers above, which the shared scripts call.
subprojects {
    // versions/<mc> itself only holds its version's properties (gradle.properties) for the three below it.
    if (parent == rootProject) {
        return
    }

    apply plugin: 'java'
    apply plugin: 'architectury-plugin'
    ext.loomRemap = loom_remap.toBoolean()
    apply plugin: loomRemap ? 'dev.architectury.loom' : 'dev.architectury.loom-no-remap'
    // The version's other projects (":1.21.1:common" and so on).
    ext.sibling = { String part -> "${parent.path}:${part}" }

    architectury {
        minecraft = minecraft_version
    }

    version = "${mod_version}+mc${minecraft_version}"
    group = mod_group_id
    base {
        archivesName = project.name == 'common' ? mod_id : "${mod_id}-${project.name}"
    }

    if (loomRemap) {
        loom {
            silentMojangMappingsLicense()
            // The mixin annotation processor and its refmap, as the 1.21.1 jars always had (Loom 1.17 would otherwise
            // remap the annotations in place, and a name without a descriptor would no longer stand for one method).
            mixin {
                useLegacyMixinAp = true
                // Named as before the versions/ projects (wgaccel-common-refmap.json, not wgaccel-1.21.1_common-...).
                defaultRefmapName = "${base.archivesName.get()}-${project.name}-refmap.json"
            }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        if (loomRemap) {
            mappings loom.officialMojangMappings()
        }
    }

    java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = java_version as int
    }

    apply from: rootProject.file("gradle/${project.name}.gradle")
}

// `gradlew.bat build` also copies every version's loader jars to build/libs here, where the jars of earlier versions are.
// Each loader project's finished jar is its finalJar (gradle/fabric.gradle, gradle/neoforge.gradle).
def loaderJars = { subprojects.findAll { it.name in ['neoforge', 'fabric'] }.collect { it.finalJar } }
// A plain copy, not a Copy task: build/libs is not this task's output, so Gradle never clears it (as a Copy task with no
// history it did, when Gradle 9.5.1 started a new history, and the jars of earlier versions went with it).
tasks.register('collectJars') {
    dependsOn loaderJars
    def libs = layout.buildDirectory.dir('libs')
    doLast {
        project.copy {
            from loaderJars()
            into libs
        }
    }
}

apply plugin: 'base'

tasks.named('build') {
    dependsOn 'collectJars'
}
