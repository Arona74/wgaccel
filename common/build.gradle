architectury {
    common('neoforge', 'fabric')
    // No @ExpectPlatform here (platform/Platform finds the loader's class itself): no injected helper class.
    injectInjectables = false
}

loom {
    // Minecraft's private fields and methods the mod reads, made public at build time (Fabric reads this file as it
    // is; NeoForge's jar gets it as an access transformer).
    accessWidenerPath = file('src/main/resources/wgaccel.accesswidener')
}

dependencies {
    // Mixin and MixinExtras at compile time (both loaders bring their own in the game).
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    // @Nullable (NeoForge brought it; vanilla Minecraft does not).
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    // Copied into each loader jar (see relocateLwjgl in the root build.gradle). LWJGL's core comes with the game.
    rootProject.lwjglShaded.each { implementation(it) { transitive = false } }
    // Optional at run time: FreeTerraForged's tiles are read for the ground height (copy its jar into libs/ to build).
    // The same classes on NeoForge and Fabric (its common module).
    compileOnly rootProject.files(project.findProperty('ftfJar') ?: 'libs/freeterraforged-1.0.0010.jar')
    // FreeTerraForged's deleteTiles builds (1.0.0013, now 1.0.0014) after it, for the classes 1.0.0010 does not have
    // (cell.filter.FilterGrid for the erosion filter on its chunk grids); the ones both have resolve to 1.0.0010's above.
    compileOnly rootProject.files(project.findProperty('ftf13Jar') ?: 'libs/freeterraforged-1.0.0014.jar')
    // Optional at run time: C2ME's chunk system (the 4x4 area step's status and dependency hooks). Copied from the C2ME
    // jar's META-INF/jars into libs/c2me/ (base-all for flowsched, rewrites-chunk-system, rxjava) to build.
    compileOnly fileTree(dir: rootProject.file('libs/c2me'), include: '*.jar')
    // Optional at run time: No Man's Land's ore veins and noise fields (mixin/compat; copy its jar into libs/ to build).
    compileOnly rootProject.files('libs/nomansland-1.6.2.jar')
}

// The game instance's logs folder, where the mod saves the sources and chunks the offline checks read: -Plogs=<folder>,
// or logs=<folder> in the user's own ~/.gradle/gradle.properties.
def gameLogs = project.findProperty('logs') ?: rootProject.file('run/logs').path
tasks.withType(JavaExec).configureEach {
    systemProperty 'wgaccel.logs', gameLogs
    // Offline checks for another GPU architecture: -PgpuArch=61 (GTX 10xx), 75 (RTX 20xx), ... (a newer card runs older PTX).
    if (project.findProperty('gpuArch')) {
        systemProperty 'wgaccel.gpuArch', project.findProperty('gpuArch')
    }
    // The checks that go through gpu/Gpu on an AMD card: -PgpuBackend=hip (e.g. `gradlew.bat cudaErosionCheck -PgpuBackend=hip`).
    if (project.findProperty('gpuBackend')) {
        systemProperty 'wgaccel.gpuBackend', project.findProperty('gpuBackend')
    }
}

// A standalone check of the GPU route, outside the game: `gradlew.bat cudaCheck` lists the GPU, compiles a kernel with
// NVRTC at run time and compares its float results with Java's, bit for bit. LWJGL 3.3.3 is Minecraft 1.21.1's.
repositories {
    mavenCentral()
}

sourceSets {
    cudacheck {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

dependencies {
    cudacheckImplementation 'org.lwjgl:lwjgl:3.3.3'
    cudacheckImplementation 'org.lwjgl:lwjgl-cuda:3.3.3'
    cudacheckImplementation 'org.lwjgl:lwjgl-opencl:3.3.3'
    cudacheckRuntimeOnly 'org.lwjgl:lwjgl:3.3.3:natives-windows'
    // FreeTerraForged's NoiseUtil (its noise tables) loads on its own, without Minecraft.
    cudacheckImplementation rootProject.files('libs/freeterraforged-1.0.0010.jar')
}

tasks.register('cudaCheck', JavaExec) {
    group = 'verification'
    description = 'Runs the standalone CUDA check (GPU, NVRTC, bit-identical floats).'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.CudaCheck'
    def cuda = System.getenv('CUDA_PATH') ?: 'C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.9'
    environment 'PATH', "${cuda}/bin;" + System.getenv('PATH')
    systemProperty 'wgaccel.nvrtc', "${cuda}/bin/nvrtc64_120_0.dll"
}

// The same on an AMD card: `gradlew.bat hipCheck` uses the driver's HIP runtime and the AMD HIP SDK's hipRTC (found as
// the mod finds it: -Dwgaccel.hiprtc, HIP_PATH, C:/Program Files/AMD/ROCm/*, PATH), then compiles the fixed kernel sources.
// Whether an OpenCL backend (Intel GPUs) is worth making: `gradlew.bat openClProbeJar` makes build/libs/
// wgaccel-openclprobe.jar, which runs on any Windows PC with Java (`java -jar wgaccel-openclprobe.jar`); `openclCheck`
// runs it here. Its data (vanilla noise values from the real game classes, the kernels' CUDA sources) is made first.
def probeData = layout.buildDirectory.dir('openclprobe')
tasks.register('openClProbeData', JavaExec) {
    group = 'verification'
    description = 'Makes the OpenCL probe\'s data (kernel sources, vanilla noise values).'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.OpenClProbeData'
    args probeData.get().file('openclprobe.bin').asFile.path
    outputs.dir probeData
}

tasks.register('openClProbeJar', Jar) {
    group = 'verification'
    description = 'Makes the standalone OpenCL probe jar (java -jar wgaccel-openclprobe.jar).'
    dependsOn 'openClProbeData', 'cudacheckClasses'
    archiveFileName = 'wgaccel-openclprobe.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.cudacheck.output) {
        include 'com/wgaccel/cudacheck/OpenClProbe.class', 'com/wgaccel/cudacheck/OpenClProbe$*.class', 'com/wgaccel/cudacheck/OpenClProbeData.class'
    }
    from probeData
    from({ configurations.cudacheckRuntimeClasspath.filter { it.name.startsWith('lwjgl') }.collect { zipTree(it) } }) {
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/MANIFEST.MF', 'module-info.class', 'META-INF/versions/**'
    }
    manifest {
        attributes 'Main-Class': 'com.wgaccel.cudacheck.OpenClProbe'
    }
}

// The noise fill bench for another PC (`gradlew.bat fillCheckJar`): java -Dwgaccel.gpuBackend=opencl -Dwgaccel.gpuDevice=1
// -Dwgaccel.logs=<instance logs> -Dwgaccel.veinDebug=true -jar wgaccel-fillcheck.jar. The mod's GPU classes and LWJGL only.
tasks.register('fillCheckJar', Jar) {
    group = 'verification'
    description = 'Makes the standalone noise fill bench jar (game-saved chunks against a GPU backend).'
    dependsOn 'cudacheckClasses', 'classes'
    archiveFileName = 'wgaccel-fillcheck.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.cudacheck.output) {
        include 'com/wgaccel/cudacheck/FillBench.class', 'com/wgaccel/cudacheck/FillBench$*.class'
    }
    from(sourceSets.main.output) {
        include 'com/wgaccel/gpu/**'
    }
    from({ configurations.cudacheckRuntimeClasspath.filter { it.name.startsWith('lwjgl') }.collect { zipTree(it) } }) {
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/MANIFEST.MF', 'module-info.class', 'META-INF/versions/**'
    }
    manifest {
        attributes 'Main-Class': 'com.wgaccel.cudacheck.FillBench'
    }
}

tasks.register('openclCheck', JavaExec) {
    group = 'verification'
    description = 'Runs the OpenCL probe here.'
    dependsOn 'openClProbeData'
    classpath = sourceSets.cudacheck.runtimeClasspath + files(probeData)
    mainClass = 'com.wgaccel.cudacheck.OpenClProbe'
    workingDir = layout.buildDirectory.dir('openclprobe').get().asFile
}

tasks.register('gpuMemoryCheck', JavaExec) {
    group = 'verification'
    description = 'Measures the RAM the GPU runtime takes per stream and per loaded program.'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.GpuMemoryCheck'
}

// Any check on another backend: `gradlew.bat cudaErosionCheck -PgpuBackend=opencl` (or hip).
tasks.withType(JavaExec).configureEach {
    if (project.findProperty('gpuBackend')) {
        systemProperty 'wgaccel.gpuBackend', project.findProperty('gpuBackend')
    }
}

