// The real noise fill outside the game: `gradlew.bat cudaFillBench` compiles the instance's logs/wgaccel-noise-fill.cu,
// checks the chunks the game saved beside it (wgaccel-noise-fill-sample-N.bin) byte for byte and times the kernels.
tasks.register('cudaFillBench', JavaExec) {
    group = 'verification'
    description = 'Runs the game-made noise fill code on the GPU against the chunks the game saved, and times it.'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.FillBench'
    if (project.hasProperty('veinDebug')) {
        systemProperty 'wgaccel.veinDebug', 'true'
    }
    def cuda = System.getenv('CUDA_PATH') ?: 'C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.9'
    environment 'PATH', "${cuda}/bin;" + System.getenv('PATH')
    systemProperty 'wgaccel.nvrtc', "${cuda}/bin/nvrtc64_120_0.dll"
    if (project.hasProperty('fillSource')) {
        systemProperty 'wgaccel.fillSource', project.property('fillSource')
    }
    if (project.hasProperty('cache')) {
        systemProperty 'wgaccel.cache', project.property('cache')
    }
}

