// Generated noise trees outside the game: `gradlew.bat cudaTreeCheck` builds stand-in trees of every FreeTerraForged
// noise kind, generates their CUDA, compiles it with NVRTC and runs it (catches codegen mistakes before a world load).
tasks.register('cudaTreeCheck', JavaExec) {
    group = 'verification'
    description = 'Generates, compiles and runs CUDA for stand-in noise trees of every kind.'
    classpath = sourceSets.cudacheck.runtimeClasspath
    mainClass = 'com.wgaccel.cudacheck.TreeCodegenCheck'
    def cuda = System.getenv('CUDA_PATH') ?: 'C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.9'
    environment 'PATH', "${cuda}/bin;" + System.getenv('PATH')
    systemProperty 'wgaccel.nvrtc', "${cuda}/bin/nvrtc64_120_0.dll"
}

