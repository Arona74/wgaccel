// The mod itself, for one Minecraft version: the shared code (common/src) and the version's own (versions/<mc>/common/src).
architectury {
    common('neoforge', 'fabric')
    // No @ExpectPlatform here (platform/Platform finds the loader's class itself): no injected helper class.
    injectInjectables = false
}

sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}

loom {
    // Minecraft's private fields and methods the mod reads, made public at build time (Fabric reads this file as it
    // is; NeoForge's jar gets it as an access transformer). Per version: its header names the game's namespace.
    accessWidenerPath = file('src/main/resources/wgaccel.accesswidener')
}

// The mixin configs' Java level is the version's (JAVA_21, JAVA_25).
processResources {
    def properties = [mixin_java: mixin_java]
    inputs.properties properties
    filesMatching('*.mixins.json') {
        expand properties
    }
}

repositories {
    // The shaded LWJGL modules (LWJGL's core comes from Minecraft's own repository).
    mavenCentral()
}

dependencies {
    // Mixin and MixinExtras at compile time (both loaders bring their own in the game).
    if (loomRemap) {
        modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    } else {
        implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    }
    // @Nullable (NeoForge brought it; vanilla Minecraft does not).
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    // Copied into each loader jar (see relocateLwjgl in the root build.gradle). LWJGL's core comes with the game.
    rootProject.lwjglShaded(lwjgl_shaded).each { implementation(it) { transitive = false } }
    // Optional at run time: FreeTerraForged's tiles are read for the ground height (copy its jar into libs/ to build).
    // The same classes on NeoForge and Fabric (its common module). FreeTerraForged is made for 1.21.1 only: on other
    // versions its code is compiled against the same jar and stays off (FreeTerraForged is never there).
    compileOnly rootProject.files(project.findProperty('ftfJar') ?: 'libs/freeterraforged-1.0.0010.jar')
    // FreeTerraForged's deleteTiles builds (1.0.0013, now 1.0.0014) after it, for the classes 1.0.0010 does not have
    // (cell.filter.FilterGrid for the erosion filter on its chunk grids); the ones both have resolve to 1.0.0010's above.
    compileOnly rootProject.files(project.findProperty('ftf13Jar') ?: 'libs/freeterraforged-1.0.0014.jar')
    // Optional at run time: C2ME's chunk system (the 4x4 area step's status and dependency hooks). Copied from the C2ME
    // jar's META-INF/jars into libs/c2me/ (1.21.1) or libs/c2me-<mc>/ (base-all for flowsched, rewrites-chunk-system,
    // rxjava) to build.
    compileOnly fileTree(dir: rootProject.file(minecraft_version == '1.21.1' ? 'libs/c2me' : "libs/c2me-${minecraft_version}"), include: '*.jar')
    // Optional at run time: No Man's Land's ore veins and noise fields (mixin/compat; copy its jar into libs/ to build).
    compileOnly rootProject.files('libs/nomansland-1.6.2.jar')
}
