// The mod itself, for one Minecraft version: the shared code (common/src) and the version's own (versions/<mc>/common/src).
architectury {
    common('neoforge', 'fabric')
    // No @ExpectPlatform here (platform/Platform finds the loader's class itself): no injected helper class.
    injectInjectables = false
}

sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}

loom {
    // Minecraft's private fields and methods the mod reads, made public at build time (Fabric reads this file as it
    // is; NeoForge's jar gets it as an access transformer). Per version: its header names the game's namespace.
    accessWidenerPath = file('src/main/resources/wgaccel.accesswidener')
}

// The mixin configs' Java level is the version's (JAVA_21, JAVA_25); the LWJGL version for gpu/Lwjgl's check.
processResources {
    def properties = [mixin_java: mixin_java, lwjgl_version: lwjgl_version]
    inputs.properties properties
    filesMatching(['*.mixins.json', 'wgaccel-lwjgl.properties']) {
        expand properties
    }
}

repositories {
    // The shaded LWJGL modules (LWJGL's core comes from Minecraft's own repository).
    mavenCentral()
}

// The mixins compiled against Mixin 0.17.3 (Fabric Loader 0.19). Its 0.17.4 (Loader 0.20) made @Redirect's `at` an
// array, so a jar compiled against it writes at = [@At]: Loader 0.19.3's MixinExtras 0.5.4 casts that to one @At and the
// game stops at its start (OreFeature, a user's Conquest Reforged pack, 1 Nov 2026). One @At is read by both.
configurations.matching { it.name == 'compileClasspath' }.configureEach {
    resolutionStrategy.force 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'
}

dependencies {
    // Mixin and MixinExtras at compile time (both loaders bring their own in the game).
    if (loomRemap) {
        modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    } else {
        implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    }
    // @Nullable (NeoForge brought it; vanilla Minecraft does not).
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    // Copied into each loader jar (see relocateLwjgl in the root build.gradle). LWJGL's core comes with the game.
    rootProject.lwjglShaded(lwjgl_shaded).each { implementation(it) { transitive = false } }
    // Optional at run time: FreeTerraForged's tiles are read for the ground height (copy its jar into libs/ to build).
    // The same classes on NeoForge and Fabric (its common module). FreeTerraForged is made for 1.21.1 only: on other
    // versions its code is compiled against the same jar and stays off (FreeTerraForged is never there).
    compileOnly rootProject.files(project.findProperty('ftfJar') ?: 'libs/freeterraforged-1.0.0010.jar')
    // FreeTerraForged's deleteTiles builds (1.0.0013, now 1.0.0014) after it, for the classes 1.0.0010 does not have
    // (cell.filter.FilterGrid for the erosion filter on its chunk grids); the ones both have resolve to 1.0.0010's above.
    // Now 1.0.0032: its FilterGrid has getCellSpacing() (the erosion filter on world-space region/chunk grids), 1.0.0014's does not.
    compileOnly rootProject.files(project.findProperty('ftf13Jar') ?: 'libs/freeterraforged-1.0.0032.jar')
    // FreeTerraForged 1.0.0024's new classes (its continents' PlateUpliftBridge), after both: the ones they have resolve to theirs.
    // 1.0.0032 still has them.
    compileOnly rootProject.files(project.findProperty('ftf24Jar') ?: 'libs/freeterraforged-1.0.0032.jar')
    // Optional at run time: C2ME's chunk system (the 4x4 area step's status and dependency hooks). Copied from the C2ME
    // jar's META-INF/jars into libs/c2me/ (1.21.1) or libs/c2me-<mc>/ (base-all for flowsched, rewrites-chunk-system,
    // rxjava) to build.
    compileOnly fileTree(dir: rootProject.file(minecraft_version == '1.21.1' ? 'libs/c2me' : "libs/c2me-${minecraft_version}"), include: '*.jar')
    // Optional at run time: No Man's Land's ore veins and noise fields (mixin/compat; copy its jar into libs/ to build).
    compileOnly rootProject.files('libs/nomansland-1.6.2.jar')
    // Optional at run time: Voxy Server Side / LOD Server Support (MIT; its generation service and column translation,
    // mixin/compat/VssGenerationMixin). Its common classes and the server ones keep their names on every loader.
    compileOnly rootProject.files('libs/lod-server-support-neoforge-0.23.0-beta.1+1.21.1.jar')
    // Optional at run time: Distant Horizons' API (its world generator override, gen/DhLodGenerator). Only its
    // com.seibel.distanthorizons.api and .coreapi packages, copied out of the Distant Horizons jar into this one; the
    // API has no Minecraft classes, so one jar serves every Minecraft version.
    compileOnly rootProject.files('libs/distanthorizons-api-3.3.3.jar')
}
